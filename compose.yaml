services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opsmind
      POSTGRES_USER: opsmind
      POSTGRES_PASSWORD: opsmind-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmind -d opsmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: apps/api
    environment:
      OPSMIND_ENVIRONMENT: docker
      OPSMIND_DATABASE_URL: postgresql+psycopg://opsmind:opsmind-local-only@postgres:5432/opsmind
      OPSMIND_JWT_SECRET: docker-local-change-before-deployment
      OPSMIND_SEED_DEMO_DATA: "true"
      OPSMIND_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      OPSMIND_LLM_MODE: demo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: apps/web
      args:
        VITE_API_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
