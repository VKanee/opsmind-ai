name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: 后端质量检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: 安装依赖
        run: python -m pip install -e ".[dev]"
      - name: 代码检查
        run: ruff check app tests
      - name: 格式检查
        run: ruff format --check app tests
      - name: 类型检查
        run: mypy app
      - name: 数据库迁移检查
        env:
          OPSMIND_DATABASE_URL: sqlite:///./data/ci-migration.db
        run: |
          mkdir -p data
          alembic upgrade head
          alembic check
      - name: 后端测试
        run: pytest --cov=app --cov-report=term-missing
      - name: AI 固定评测
        run: python -m app.evaluation

  web:
    name: 前端质量检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 代码检查
        run: npm run lint
      - name: 前端测试
        run: npm test
      - name: 生产构建
        run: npm run build

  containers:
    name: 容器构建
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建 API 镜像
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: opsmind-api:ci
      - name: 构建 Web 镜像
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          tags: opsmind-web:ci

  e2e:
    name: 浏览器冒烟测试
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装后端依赖
        working-directory: apps/api
        run: python -m pip install -e ".[dev]"
      - name: 安装前端依赖
        working-directory: apps/web
        run: npm ci
      - name: 安装 Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: 启动服务
        run: |
          (cd apps/api && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/opsmind-api.log 2>&1 &)
          (cd apps/web && nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/opsmind-web.log 2>&1 &)
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null && curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/opsmind-api.log
          cat /tmp/opsmind-web.log
          exit 1
      - name: 执行浏览器测试
        working-directory: apps/web
        run: npm run test:e2e
