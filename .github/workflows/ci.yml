name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Format check
        run: ruff format --check app tests
      - name: Type check
        run: mypy app
      - name: Migration check
        env:
          OPSMIND_DATABASE_URL: sqlite:///./data/ci-migration.db
        run: |
          mkdir -p data
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing
      - name: Golden evaluation
        run: python -m app.evaluation

  web:
    name: Web quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: opsmind-api:ci
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          tags: opsmind-web:ci

  e2e:
    name: Browser smoke
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API
        working-directory: apps/api
        run: python -m pip install -e ".[dev]"
      - name: Install web
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start services
        run: |
          (cd apps/api && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/opsmind-api.log 2>&1 &)
          (cd apps/web && nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/opsmind-web.log 2>&1 &)
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null && curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/opsmind-api.log
          cat /tmp/opsmind-web.log
          exit 1
      - name: Browser smoke test
        working-directory: apps/web
        run: npm run test:e2e
